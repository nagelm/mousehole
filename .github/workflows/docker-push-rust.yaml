# Mirror of docker-push.yaml for the Rust backend (Dockerfile.rust).
# Publishes variant tags alongside the Bun image in the same repository, so
# existing users are untouched until `latest` is deliberately switched:
#   rust          — latest release of the Rust variant (the stable pointer)
#   0.5.0-rust    — semver, suffixed
#   edge-rust     — tip of master
#   pr-<n>-rust   — pull requests

name: Push to Docker Hub (Rust)

on:
  release:
    types: [published]
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.IMAGE_REPOSITORY }}
          flavor: |
            latest=false
            suffix=-rust,onlatest=false
          tags: |
            type=edge
            type=ref,event=pr
            type=raw,value=rust,suffix=,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set short git sha
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_HASH=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,mode=max,scope=rust
