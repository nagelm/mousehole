[package]
name = "mousehole"
version = "0.1.0"
edition = "2021"
description = "Rust backend for mousehole — MyAnonamouse dynamic-seedbox IP updater. Drop-in replacement for the Bun backend; serves the original Vite-built frontend unmodified."
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
thiserror = "2"
anyhow = "1"
rand = "0.9"
subtle = "2"          # constant-time credential comparison
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
percent-encoding = "2"
url = "2"
cookie = "0.18"
base64 = "0.22"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
